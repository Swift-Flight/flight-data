name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3.3"]
    # The official image pins the exact patch release. swift-actions/setup-swift
    # only accepts a minor version, and "6.2" was resolving to 6.2.1.
    container: swift:${{ matrix.swift }}

    # The Postgres and Valkey suites skip without these, and a green run that
    # skipped every integration test proves almost nothing: the drivers are
    # the whole reason this package exists.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: flight
          POSTGRES_DB: flight_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      # flight, hangar and swift-changeset are resolved by URL now, and
      # those repositories are private — so git needs the token. The sibling
      # checkouts this replaced existed only for the path dependencies that
      # v0.1.0 removed. This step disappears when the repositories go public.
      - name: Authenticate git for private package resolution
        run: |
          if [ -z "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            echo "::error::SWIFTFLIGHT_CI_TOKEN is not set."
            exit 1
          fi
          git config --global url."https://x-access-token:${{ secrets.SWIFTFLIGHT_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Build (Flight's own warnings are errors)
        env:
          FLIGHT_STRICT_WARNINGS: "1"
        run: swift build --enable-all-traits

      # Fails rather than silently skipping: an unset variable here would
      # turn the integration suites off without turning the job red.
      - name: Verify the integration gates are armed
        # Written without bash-only indirect expansion: ${!var} is a syntax
        # error under sh, which fails the step for the wrong reason.
        run: |
          fail=0
          [ -n "$FLIGHT_POSTGRES_TEST_DATABASE_URL" ] || { echo "::error::FLIGHT_POSTGRES_TEST_DATABASE_URL is unset"; fail=1; }
          [ -n "$FLIGHT_MIGRATE_TEST_DATABASE_URL" ] || { echo "::error::FLIGHT_MIGRATE_TEST_DATABASE_URL is unset"; fail=1; }
          [ -n "$FLIGHT_VALKEY_TEST_URL" ] || { echo "::error::FLIGHT_VALKEY_TEST_URL is unset"; fail=1; }
          [ "$fail" = "0" ] || { echo "::error::integration tests would skip"; exit 1; }
        env:
          FLIGHT_POSTGRES_TEST_DATABASE_URL: postgres://postgres:flight@postgres:5432/flight_test
          FLIGHT_MIGRATE_TEST_DATABASE_URL: postgres://postgres:flight@postgres:5432/flight_test
          FLIGHT_VALKEY_TEST_URL: redis://valkey:6379

      - name: Test
        env:
          FLIGHT_POSTGRES_TEST_DATABASE_URL: postgres://postgres:flight@postgres:5432/flight_test
          FLIGHT_MIGRATE_TEST_DATABASE_URL: postgres://postgres:flight@postgres:5432/flight_test
          FLIGHT_VALKEY_TEST_URL: redis://valkey:6379
        run: ./CI/run-tests.sh

      # The lean configuration is a supported consumption mode, so it is
      # built too: this is what a consumer using only the container gets.
      # A root build compiles every target regardless of traits, so it cannot
      # verify the lean configuration. This builds an actual consumer and
      # fails if any gated dependency leaked into its resolution.
      - name: Lean consumer resolves no gated dependency
        run: ./CI/check-lean-consumer.sh

  lint:
    # Advisory only. The merged packages predate a shared .swift-format
    # config; the macro fixture suites in particular hold expected-expansion
    # string literals that a bulk reformat would corrupt. This job reports
    # drift without blocking merges until that reformat lands on its own.
    name: Format (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swift:6.3.3

    # The Postgres and Valkey suites skip without these, and a green run that
    # skipped every integration test proves almost nothing: the drivers are
    # the whole reason this package exists.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: flight
          POSTGRES_DB: flight_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4


      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # Every module with a .docc catalogue, each with --warnings-as-errors:
      # an unresolved symbol link, a doc comment naming a renamed parameter,
      # or a Topics entry pointing at a symbol that no longer exists all fail
      # the job. Documentation that nothing checks rots into documentation
      # that is wrong, which is worse than none.
      - name: Generate documentation
        env:
          FLIGHT_BUILD_DOCS: "1"
        run: |
          # The plugin *moves* its archive to --output-path, so the parent
          # has to exist first.
          mkdir -p ./docs
          for target in FlightDataCore FlightCache FlightDataPostgres FlightMigrate; do
            echo "::group::$target"
            swift package --enable-all-traits \
              --allow-writing-to-directory "./docs/$target" \
              generate-documentation --target "$target" \
              --warnings-as-errors --output-path "./docs/$target"
            echo "::endgroup::"
          done

  macos:
    name: Build on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # swiftly rather than swift-actions/setup-swift: this package declares
      # swift-tools-version 6.3, and setup-swift only indexes up to 6.2.
      # swiftly is also what the toolchain is managed with locally, so CI and
      # a developer's machine resolve the same way.
      - name: Install Swift
        run: |
          curl -fsSL -o swiftly.pkg https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install 6.3.3 --use --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: swift --version

      # Build only. macOS runners have no Docker and GitHub service
      # containers are Linux-only, so the driver suites — the whole point of
      # this package — cannot run here. Linux carries the test coverage,
      # gated so it cannot skip silently.
      - name: Build
        run: swift build --enable-all-traits
