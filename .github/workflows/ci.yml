name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]

    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check the sibling-repository token is present
        run: |
          if [ -z "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            echo "::error::SWIFTFLIGHT_CI_TOKEN is not set. flight-cache-valkey resolves"
            echo "::error::flight-cache, flight-config, flight-core by relative path, and these repositories are"
            echo "::error::private, so CI needs a token with read access to them."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: Cache/flight-cache-valkey

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-cache
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Cache/flight-cache

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-config
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Config/flight-config

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-core
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Core/flight-core

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Build (warnings are errors)
        working-directory: Cache/flight-cache-valkey
        run: swift build -Xswiftc -warnings-as-errors

      # Building the test target separately: a package whose sources compile
      # while its tests do not is exactly what a cached local build hides.
      - name: Build tests
        working-directory: Cache/flight-cache-valkey
        run: swift build --build-tests

      # Fails rather than silently skipping if the service is unreachable.
      # A green run that skipped every integration test proves almost nothing.
      - name: Verify the integration gate is armed
        env:
          FLIGHT_VALKEY_TEST_URL: redis://localhost:6379
        run: |
          if [ -z "$FLIGHT_VALKEY_TEST_URL" ]; then
            echo "::error::integration tests would skip — the service URL is unset"
            exit 1
          fi

      - name: Test
        env:
          FLIGHT_VALKEY_TEST_URL: redis://localhost:6379
        working-directory: Cache/flight-cache-valkey
        run: swift test
