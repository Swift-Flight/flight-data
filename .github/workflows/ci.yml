name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check the sibling-repository token is present
        run: |
          if [ -z "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            echo "::error::SWIFTFLIGHT_CI_TOKEN is not set. flight-data-postgres resolves"
            echo "::error::flight-config, flight-core, flight-data-core, flight-migrate, swift-changeset, hangar by relative path, and these repositories are"
            echo "::error::private, so CI needs a token with read access to them."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: Data/flight-data-postgres

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-config
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Config/flight-config

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-core
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Core/flight-core

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-data-core
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Data/flight-data-core

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-migrate
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Data/flight-migrate

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/swift-changeset
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Data/swift-changeset

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/hangar
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Hangar/hangar

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Build (warnings are errors)
        working-directory: Data/flight-data-postgres
        run: swift build -Xswiftc -warnings-as-errors

      # Building the test target separately: a package whose sources compile
      # while its tests do not is exactly what a cached local build hides.
      - name: Build tests
        working-directory: Data/flight-data-postgres
        run: swift build --build-tests

      # Fails rather than silently skipping if the service is unreachable.
      # A green run that skipped every integration test proves almost nothing.
      - name: Verify the integration gate is armed
        env:
          FLIGHT_POSTGRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flight_test
        run: |
          if [ -z "$FLIGHT_POSTGRES_TEST_DATABASE_URL" ]; then
            echo "::error::integration tests would skip — the service URL is unset"
            exit 1
          fi

      - name: Test
        env:
          FLIGHT_POSTGRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flight_test
        working-directory: Data/flight-data-postgres
        run: swift test
